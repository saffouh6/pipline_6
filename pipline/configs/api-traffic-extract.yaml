pipeline:
  name: api-traffic-extract
  source:
    type: file
    params: { path: data/access-small.log }
  stages:
    - type: parse
      params: { format: clf }
    - type: filter
      params: { field: path, value: /api }
    - type: project
      params: { fields: [timestamp, clientIp, method, path, status] }
  sink:
    type: file
    params: { path: out/api-traffic.txt }